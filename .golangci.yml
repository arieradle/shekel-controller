version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment

issues:
  exclude-rules:
    - path: zz_generated
      linters: [errcheck]
    - path: _test\.go
      linters: [staticcheck]
