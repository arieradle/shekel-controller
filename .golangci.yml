version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment  # not worth optimising for controller types

issues:
  exclude-rules:
    # Generated deepcopy code does not need errcheck
    - path: zz_generated
      linters: [errcheck]
    # Test files can use dot-imports (gomega)
    - path: _test\.go
      linters: [staticcheck]
